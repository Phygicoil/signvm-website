<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNVM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: pan-y;
        }

        body {
            background: #0C0B09;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .logo {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: clamp(3rem, 12vw, 10rem);
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #D4C4A8;
            text-indent: 0.35em;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 0.3s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Swipe hint indicator */
        .swipe-hint {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards, pulse 2s ease-in-out infinite;
            animation-delay: 2s, 2s;
        }

        .swipe-hint span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(212, 196, 168, 0.2);
        }

        .swipe-hint span:nth-child(2) {
            width: 6px;
            height: 6px;
            background: rgba(212, 196, 168, 0.35);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1 class="logo">SIGNVM</h1>

    <div class="swipe-hint">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <script>
        (function() {
            var startX = 0;
            var startY = 0;
            var threshold = 50;

            document.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchend', function(e) {
                var endX = e.changedTouches[0].clientX;
                var endY = e.changedTouches[0].clientY;
                var diffX = startX - endX;
                var diffY = startY - endY;

                // Horizontal swipe (left)
                if (Math.abs(diffX) > Math.abs(diffY) && diffX > threshold) {
                    window.location.href = 'index.html';
                }
            }, { passive: true });

            // Trackpad/mouse wheel horizontal scroll
            var lastScroll = 0;
            document.addEventListener('wheel', function(e) {
                // Detect horizontal scroll or shift+scroll
                var deltaX = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0;
                
                if (deltaX > 30) {
                    window.location.href = 'index.html';
                }
            }, { passive: true });
        })();
    </script>
</body>
</html>
