<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HANNON TAN — House</title>
<meta name="description" content="Cryptographic seals. Physical objects for digital acts. Signum is the first.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #F8F5F0;
    --ink:      #111111;
    --muted:    #666666;
    --brass:    #C9A66B;
    --white:    #FFFFFF;
    --rule:     rgba(17,17,17,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* fixed nav */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.75rem 2.5rem;
    background: rgba(248, 245, 240, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  nav .brand,
  nav .links a {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.65rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  nav .brand { letter-spacing: 0.4em; }
  nav .links { display: flex; gap: 2.5rem; align-items: center; }
  nav .links a, nav .links button {
    color: var(--muted);
    transition: color 0.2s;
  }
  nav .links a:hover, nav .links button:hover { color: var(--ink); }
  nav .links a.active { color: var(--ink); }

  /* TWO-COLUMN SPLIT */
  main {
    padding-top: 6rem;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }
  .image-col {
    flex: 1 1 55%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(3rem, 6vw, 6rem) clamp(2rem, 5vw, 5rem);
  }
  .image-col img {
    max-width: 100%;
    max-height: calc(100vh - 14rem);
    height: auto;
    width: auto;
    display: block;
    filter: grayscale(100%) contrast(1.02);
  }
  .text-col {
    flex: 1 1 45%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem clamp(2.5rem, 5vw, 5rem);
    text-align: left;
  }

  .headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 400;
    font-size: clamp(2rem, 3.8vw, 2.8rem);
    line-height: 1.2;
    letter-spacing: -0.018em;
    color: var(--ink);
    max-width: 22ch;
  }
  .headline em {
    font-style: italic;
    color: var(--brass);
  }

  .body {
    margin-top: clamp(2rem, 4vw, 3rem);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    max-width: 36ch;
  }
  .body p {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 400;
    font-size: clamp(1rem, 1.4vw, 1.15rem);
    line-height: 1.7;
    color: var(--ink);
    letter-spacing: -0.003em;
  }
  .body p em {
    font-style: italic;
    color: var(--ink);
  }

  /* CTA */
  .cta {
    display: inline-block;
    margin-top: clamp(2.5rem, 4vw, 3.5rem);
    padding: 1.1rem 2.75rem;
    background: var(--brass);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    text-decoration: none;
    transition: opacity 0.2s;
    border: none;
    cursor: pointer;
    align-self: flex-start;
  }
  .cta:hover { opacity: 0.85; }

  /* footer */
  footer {
    padding: 2rem 2.5rem 1.5rem;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
    border-top: 1px solid var(--rule);
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 17, 17, 0.4);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }
  .modal-overlay.is-open { display: flex; }

  .modal {
    background: var(--paper);
    padding: 4rem 3rem;
    max-width: 380px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    font-size: 1.5rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
  }
  .modal h3 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 400;
    margin-bottom: 2.5rem;
    color: var(--ink);
  }
  .modal input,
  .modal textarea {
    width: 100%;
    padding: 1rem 0;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    border: none;
    border-bottom: 1px solid rgba(17, 17, 17, 0.15);
    background: transparent;
    color: var(--ink);
    outline: none;
    margin-bottom: 2rem;
    transition: border-color 0.3s ease;
  }
  .modal textarea {
    font-size: 0.9rem;
    resize: none;
    min-height: 100px;
    line-height: 1.6;
  }
  .modal input::placeholder,
  .modal textarea::placeholder {
    color: rgba(17, 17, 17, 0.35);
  }
  .modal input:focus,
  .modal textarea:focus {
    border-color: var(--brass);
  }
  .modal button[type="submit"] {
    width: 100%;
    padding: 1.25rem 2rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--brass);
    border: none;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }
  .modal button[type="submit"]:hover { opacity: 0.85; }
  .modal-confirmation {
    display: none;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.2rem;
    font-style: italic;
    color: var(--ink);
  }

  /* mobile / narrow — stack the split */
  @media (max-width: 820px) {
    main { flex-direction: column; padding-top: 5rem; }
    .image-col {
      flex: none;
      width: 100%;
      padding: 2.5rem 1.5rem 1rem;
    }
    .image-col img { max-height: 60vh; }
    .text-col {
      flex: none;
      width: 100%;
      padding: 2rem 1.5rem 4rem;
    }
    nav { padding: 1.25rem 1.25rem; }
    nav .links { gap: 1.5rem; }
    .modal { padding: 3rem 2rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">Hannon&nbsp;&nbsp;Tan</div>
  <div class="links">
    <a href="/signum.html">Signum</a>
    <a href="/" class="active">House</a>
  </div>
</nav>

<main>

  <div class="image-col">
    <img src="/atelier.png" alt="Atelier" />
  </div>

  <div class="text-col">

    <div class="headline">
      Cryptographic <em>Seals</em>
    </div>

    <div class="body">
      <p>Physical objects for digital acts.</p>
      <p>Made to be held, kept, and used when a decision must carry weight.</p>
      <p>Signum is the first.</p>
    </div>

    <button type="button" class="cta" id="hero-cta">Request Allocation</button>

  </div>

</main>

<footer>
  Hannon&nbsp;&nbsp;Tan &nbsp;&middot;&nbsp; Adelaide &nbsp;&middot;&nbsp; 2026
</footer>

<!-- Waitlist Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <h3 id="modal-title">Request Allocation</h3>
    <form id="waitlist-form">
      <input type="hidden" name="access_key" value="08786a92-a002-47eb-bdfe-e7ddfb8e07c3">
      <input type="hidden" name="subject" value="New Allocation Request">
      <input type="hidden" name="from_name" value="Allocation Form">
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="details" placeholder="Optional — Name, handle, ring size, metal preference, or anything you'd like to register"></textarea>
      <button type="submit">Seal</button>
    </form>
    <p class="modal-confirmation" id="confirmation">Noted</p>
  </div>
</div>

<script>
(function() {
  var modal = document.getElementById('modal');
  var heroCta = document.getElementById('hero-cta');
  var modalClose = document.getElementById('modal-close');

  function openModal(e) {
    if (e) e.preventDefault();
    modal.classList.add('is-open');
  }
  function closeModal() {
    modal.classList.remove('is-open');
  }

  heroCta.addEventListener('click', openModal);
  modalClose.addEventListener('click', closeModal);

  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // Web3Forms submit
  var WEB3FORMS_URL = 'https://api.web3forms.com/submit';
  var form = document.getElementById('waitlist-form');
  var confirmation = document.getElementById('confirmation');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var formData = new FormData(form);
    var submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = '...';

    fetch(WEB3FORMS_URL, { method: 'POST', body: formData })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          form.style.display = 'none';
          document.getElementById('modal-title').style.display = 'none';
          confirmation.style.display = 'block';
          form.reset();
        } else { throw new Error('Failed'); }
      })
      .catch(function() {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Try again';
      });
  });
})();
</script>

</body>
</html>
