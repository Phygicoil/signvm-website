<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNVM — Waitlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: #0C0B09;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.2s;
        }

        .brand {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(212, 196, 168, 0.6);
        }

        .qr-code {
            width: 220px;
            height: 220px;
        }

        .waitlist-label {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 1.15rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.05em;
            color: #D4C4A8;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Navigation dots */
        .nav-dots {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
            animation-delay: 1s;
        }

        .nav-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(212, 196, 168, 0.15);
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .nav-dot:hover {
            background: rgba(212, 196, 168, 0.4);
            transform: scale(1.3);
        }

        .nav-dot.active {
            background: rgba(212, 196, 168, 0.5);
        }
    </style>
</head>
<body>

    <div class="content">
        <span class="brand">SIGNVM</span>
        
        <img 
            class="qr-code" 
            src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://signvm.vercel.app&bgcolor=0C0B09&color=D4C4A8&margin=0" 
            alt="QR code to SIGNVM waitlist"
        >
        
        <span class="waitlist-label">waitlist</span>
    </div>

    <nav class="nav-dots">
        <a href="logo.html" class="nav-dot" aria-label="Logo page"></a>
        <a href="index.html" class="nav-dot" aria-label="Home page"></a>
        <a href="qr.html" class="nav-dot active" aria-label="QR page"></a>
    </nav>

</body>
</html>
